[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "models", "browser_profile", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",   # line length do ruff format quan ly
    "B008",   # ham goi trong default arg (pytest fixture)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"ui/*" = ["B010"]

[tool.black]
line-length = 100
target-version = ["py311"]
