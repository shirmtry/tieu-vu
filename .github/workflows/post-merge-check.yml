name: post-merge-check

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

jobs:
  verify:
    if: ${{ !startsWith(github.event.head_commit.message, 'Revert') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Tests
        run: pytest -v
      - name: Lint
        run: ruff check .
      - name: Revert on failure
        if: failure()
        shell: bash
        run: |
          git config user.name "auto-revert-bot"
          git config user.email "auto-revert@tieu-vu.local"
          git fetch origin main
          git checkout -B main origin/main
          git revert ${{ github.sha }} --no-edit
          git push origin main
          gh issue create --title "[auto-revert] ${{ github.sha }}" \
            --body "Post-merge check failed; commit reverted." \
            --label auto-revert || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
