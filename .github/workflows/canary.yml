name: canary

on:
  workflow_dispatch:
  push:
    branches: ["feat/voice-click-*"]

jobs:
  soak:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Tests x3
        run: |
          pytest -v
          pytest -v
          pytest -v
      - name: Benchmarks
        run: pytest --benchmark-only
      - name: Soak (dry run, no camera/mic)
        run: python main.py --no-preview --dry-run-for 30
